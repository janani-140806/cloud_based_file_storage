<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVault - Shared File</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">

  <div class="auth-card glass-panel" style="max-width: 700px; width: 100%;">
    <!-- Brand Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <div class="brand d-flex align-items-center gap-2 fw-bold text-dark fs-5">
        <i class="bi bi-cloud-check-fill text-primary fs-3"></i> CloudVault
      </div>
      <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill">
        <i class="bi bi-link-45deg me-1"></i> Public Shared File
      </span>
    </div>

    <!-- State 1: Loading Spinner -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="text-muted mt-3 mb-0">Loading shared file...</p>
    </div>

    <!-- State 2: Password Protected Prompt -->
    <div id="passwordState" class="d-none text-center py-4">
      <i class="bi bi-shield-lock-fill text-warning" style="font-size: 3.5rem;"></i>
      <h4 class="fw-bold text-dark mt-3">Password Required</h4>
      <p class="text-muted small">This shared link is protected with a password.</p>
      
      <div class="input-group my-3 mx-auto" style="max-width: 350px;">
        <input type="password" class="form-control" id="linkPasswordInput" placeholder="Enter password...">
        <button class="btn btn-primary-custom" style="width: auto;" onclick="submitPassword()">
          Unlock <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>
      <div id="passwordError" class="text-danger small d-none">Incorrect password. Please try again.</div>
    </div>

    <!-- State 3: File View & Actions -->
    <div id="fileContentState" class="d-none">
      <div class="d-flex align-items-center gap-3 p-3 bg-light rounded-4 mb-4">
        <div id="fileIconContainer" class="fs-2 text-primary"></div>
        <div class="text-truncate flex-grow-1">
          <h5 class="fw-bold text-dark mb-1 text-truncate" id="sharedFileName">filename.pdf</h5>
          <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-light text-dark border" id="sharedFileType">PDF</span>
            <span class="text-muted small" id="sharedFileSize">0 KB</span>
          </div>
        </div>
      </div>

      <!-- Inline Preview Container -->
      <div id="sharedPreviewContainer" class="p-2 mb-4 bg-white rounded-3 border text-center" style="min-height: 250px; max-height: 50vh; overflow: auto;">
        <!-- Dynamic preview content -->
      </div>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-between align-items-center pt-2">
        <a href="login.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Go to CloudVault
        </a>
        <button class="btn btn-primary-custom px-4" id="sharedDownloadBtn" style="width: auto;">
          <i class="bi bi-download me-1"></i> Download File
        </button>
      </div>
    </div>

    <!-- State 4: Error State (Expired / Disabled) -->
    <div id="errorState" class="d-none text-center py-5">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3.5rem;"></i>
      <h4 class="fw-bold text-danger mt-3">Link Unavailable</h4>
      <p class="text-muted" id="errorMessage">This shared link does not exist or has expired.</p>
      <a href="login.html" class="btn btn-primary-custom mt-2 px-4" style="width: auto;">Go to Home</a>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api/files/share/public';
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    let enteredPassword = '';

    document.addEventListener('DOMContentLoaded', () => {
      if (!token) {
        showError('No sharing token provided.');
        return;
      }
      loadSharedFile();
    });

    async function loadSharedFile() {
      try {
        let url = `${API_BASE}/${token}`;
        if (enteredPassword) url += `?password=${encodeURIComponent(enteredPassword)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (res.status === 401 && data.requiresPassword) {
          showPasswordPrompt();
          return;
        }

        if (!res.ok) {
          showError(data.message || 'Unable to access shared file.');
          return;
        }

        renderSharedFile(data);
      } catch (err) {
        showError('Network error connecting to storage server.');
      }
    }

    function showPasswordPrompt() {
      document.getElementById('loadingState').classList.add('d-none');
      document.getElementById('fileContentState').classList.add('d-none');
      document.getElementById('errorState').classList.add('d-none');
      document.getElementById('passwordState').classList.remove('d-none');
    }

    function submitPassword() {
      enteredPassword = document.getElementById('linkPasswordInput').value;
      if (!enteredPassword) return;
      document.getElementById('passwordState').classList.add('d-none');
      document.getElementById('loadingState').classList.remove('d-none');
      loadSharedFile();
    }

    function renderSharedFile(file) {
      document.getElementById('loadingState').classList.add('d-none');
      document.getElementById('passwordState').classList.add('d-none');
      document.getElementById('errorState').classList.add('d-none');
      document.getElementById('fileContentState').classList.remove('d-none');

      document.getElementById('sharedFileName').innerText = file.originalName;
      document.getElementById('sharedFileType').innerText = (file.mimeType.split('/')[1] || 'FILE').toUpperCase();
      document.getElementById('sharedFileSize').innerText = formatBytes(file.size);

      const previewBox = document.getElementById('sharedPreviewContainer');
      let streamUrl = `${API_BASE}/${token}/stream`;
      if (enteredPassword) streamUrl += `?password=${encodeURIComponent(enteredPassword)}`;

      if (file.mimeType.startsWith('image/')) {
        previewBox.innerHTML = `<img src="${streamUrl}" class="img-fluid rounded" style="max-height: 45vh; object-fit: contain;">`;
      } else if (file.mimeType === 'application/pdf') {
        previewBox.innerHTML = `<iframe src="${streamUrl}#toolbar=1" class="w-100 rounded" style="height: 45vh; border: none;"></iframe>`;
      } else if (file.mimeType.startsWith('video/')) {
        previewBox.innerHTML = `<video controls autoplay class="w-100 rounded" style="max-height: 45vh;"><source src="${streamUrl}" type="${file.mimeType}"></video>`;
      } else if (file.mimeType.startsWith('audio/')) {
        previewBox.innerHTML = `<div class="py-4"><i class="bi bi-music-note-beamed text-primary fs-1"></i><audio controls class="w-75 mt-3"><source src="${streamUrl}" type="${file.mimeType}"></audio></div>`;
      } else {
        previewBox.innerHTML = `<div class="py-4 text-muted"><i class="bi bi-file-earmark fs-1"></i><p class="mt-2 mb-0">Preview not available for this document format.</p></div>`;
      }

      const dlBtn = document.getElementById('sharedDownloadBtn');
      if (file.permission === 'download') {
        dlBtn.classList.remove('d-none');
        let downloadUrl = `${API_BASE}/${token}/download`;
        if (enteredPassword) downloadUrl += `?password=${encodeURIComponent(enteredPassword)}`;
        dlBtn.onclick = () => window.location.href = downloadUrl;
      } else {
        dlBtn.classList.add('d-none'); // View-only share link
      }
    }

    function showError(msg) {
      document.getElementById('loadingState').classList.add('d-none');
      document.getElementById('passwordState').classList.add('d-none');
      document.getElementById('fileContentState').classList.add('d-none');
      document.getElementById('errorState').classList.remove('d-none');
      document.getElementById('errorMessage').innerText = msg;
    }

    function formatBytes(bytes) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
    }
  </script>
</body>
</html>
